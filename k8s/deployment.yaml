
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-attendance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-attendance
  template:
    metadata:
      labels:
        app: student-attendance
    spec:
      containers:
        - name: student-attendance
          image: ramyagarla/student-attendance:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: student-attendance-service
spec:
  type: NodePort
  selector:
    app: student-attendance
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
